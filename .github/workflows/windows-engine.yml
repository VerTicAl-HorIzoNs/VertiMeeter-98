name: windows-engine
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine (cpal/WASAPI)
        working-directory: engine
        run: cargo build --release --no-default-features --features cpal-backend
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp engine/target/release/vertimeeter-engine.exe out/
          (vcpkg install opus:x64-windows && cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/opus.dll" out/) || echo "opus.dll not bundled"
      - uses: actions/upload-artifact@v4
        with: { name: vertimeeter-engine-windows, path: out }
